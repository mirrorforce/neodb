name: Preview Deployment

on:
  workflow_run:
    workflows: ["Development Image"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: deployment to preview environment
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENV }}
    steps:
    - name: Send start notification
      uses: appleboy/discord-action@63ca534eba7886aa80b4cdcf59539841e8d27ef5
      with:
        webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
        webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
        color: "#6848a9"
        message: Deployment ${{ github.ref_name }} started
    - name: ssh
      uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: ${{ vars.DEPLOY_SCRIPT }}
    - name: Send complete notification
      uses: appleboy/discord-action@63ca534eba7886aa80b4cdcf59539841e8d27ef5
      with:
        webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
        webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
        color: "#6848a9"
        message: Deployment ${{ github.ref_name }} complete
