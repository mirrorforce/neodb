name: unit test

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  neodb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Run NeoDB owner tests
      shell: pwsh
      run: |
        $coveragePath = Join-Path (Get-Location) 'neodb/coverage.xml'
        & ./misc/bin/neodb-owner-test.ps1 `
          -Profile LOCAL_DOCKER_TYPESENSE `
          -CoveragePath $coveragePath
        exit $LASTEXITCODE
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: neodb/coverage.xml
        flags: neodb
        token: ${{ secrets.CODECOV_TOKEN }}

  takahe:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 6379:6379
      takahe-db:
        image: postgres:14-alpine@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310
        env:
          POSTGRES_USER: takahe
          POSTGRES_PASSWORD: takahe
          POSTGRES_DB: takahe
        options: >-
          --health-cmd "pg_isready -U takahe -d takahe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install Dependencies
      env:
        UV_PYTHON: ${{ matrix.python-version }}
      run: |
        sudo apt-get install -y libwebp-dev libjpeg-dev
        uv sync -p ${{ matrix.python-version }}
    - name: Run pytest
      # takahe has no pyproject.toml; uv resolves the unified project
      # at the repo root and runs takahe's tests from its own directory,
      # picking up takahe/pytest.ini.
      working-directory: takahe
      env:
        UV_PYTHON: ${{ matrix.python-version }}
        TAKAHE_DATABASE_SERVER: postgres://takahe:takahe@127.0.0.1:5432/takahe
      run: |
        uv run --project .. python -m pytest --cov=. --cov-report=term-missing --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: takahe/coverage.xml
        flags: takahe
        token: ${{ secrets.CODECOV_TOKEN }}
